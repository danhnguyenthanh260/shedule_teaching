<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Google...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            margin: 20px 0 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin: 10px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Đang xác thực...</h1>
        <p>Vui lòng chờ trong khi chúng tôi xác thực tài khoản của bạn</p>
    </div>

    <script>
        // 🔐 SECURITY: OAuth state validation to prevent CSRF attacks
        const STATE_EXPIRY_MS = 5 * 60 * 1000; // ✅ 5 minute expiry
        
        // Extract authorization code and state from URL
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        const stateFromUrl = urlParams.get('state');
        
        // 🔑 Retrieve stored state + timestamp from sessionStorage
        const storedStateData = sessionStorage.getItem('oauth_state_data');
        
        // ✅ VALIDATE state parameter with expiry check
        let isStateValid = false;
        if (storedStateData) {
          try {
            const stateData = JSON.parse(storedStateData);
            const storedState = stateData.state;
            const storedTimestamp = stateData.timestamp;
            
            // Check 1: State matches
            const stateMatches = stateFromUrl && storedState === stateFromUrl;
            
            // Check 2: State not expired (within 5 minutes)
            const now = Date.now();
            const stateAge = now - storedTimestamp;
            const notExpired = stateAge < STATE_EXPIRY_MS;
            
            isStateValid = stateMatches && notExpired;
            
            if (!stateMatches) {
              console.error('❌ CSRF: State mismatch');
            }
            if (!notExpired) {
              console.error(`❌ CSRF: State expired (${stateAge}ms > ${STATE_EXPIRY_MS}ms)`);
            }
          } catch (e) {
            console.error('❌ Invalid state data format', e);
          }
        }
        
        if (authCode) {
            if (!isStateValid) {
                // 🔴 CSRF detected: State mismatch or expired
                console.error('❌ CSRF detected: OAuth state invalid');
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_ERROR',
                    error: 'CSRF_DETECTED',
                    message: 'OAuth state validation failed - possible CSRF attack'
                }, window.location.origin);
                
                // Clear state immediately on failure
                sessionStorage.removeItem('oauth_state_data');
                
                setTimeout(() => window.close(), 2000);
            } else {
                // ✅ State is valid, send auth code to parent window
                console.log('✅ OAuth state validation successful');
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_CODE',
                    code: authCode,
                    state: stateFromUrl
                }, window.location.origin);
                
                // ✅ CLEAR state immediately after successful validation
                sessionStorage.removeItem('oauth_state_data');
                
                // Close callback window
                setTimeout(() => {
                    window.close();
                }, 500);
            }
        } else {
            // Handle error
            const error = urlParams.get('error');
            if (error) {
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_ERROR',
                    error: error
                }, window.location.origin);
            }
            
            // Clear stored state
            sessionStorage.removeItem('oauth_state');
            setTimeout(() => {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
